<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Coach Login - Segar Archery School</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo Container -->
            <div class="flex justify-center mb-8">
                <img
                    src="{{url_for('static',filename='images/logo.png')}}"
                    alt="Archery Club Logo"
                    class="w-48 h-48 object-contain"
                />
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-lg shadow-md p-8">
                <h1
                    class="text-2xl font-semibold text-gray-800 text-center mb-6"
                >
                    Coach Login
                </h1>

                <form
                    action=""
                    id="coach-login"
                    class="space-y-5"
                    name="coach-login"
                    method="POST"
                >
                    <!-- Username Field -->
                    <div>
                        <label
                            for="username"
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Username</label
                        >
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                            placeholder="Enter your username"
                            required
                        />
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label
                            for="password"
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Password</label
                        >
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                            placeholder="Enter your password"
                            required
                        />
                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-md transition duration-200 ease-in-out"
                    >
                        Login
                    </button>
                </form>
            </div>
        </div>
        <script>
            let formLogin = document.getElementById("coach-login");

            function coachLogin() {
                let formdata = new FormData(formLogin);

                fetch("/api/coach/login", {
                    method: "POST",
                    body: formdata,
                })
                    .then(async (response) => {
                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.message || "Error");
                        }
                        return data;
                    })
                    .then((data) => {
                        alert(data.message);
                    })
                    .catch((error) => {
                        alert(error);
                        console.error(error);
                    });
            }

            formLogin.addEventListener("submit", (event) => {
                event.preventDefault();
                coachLogin();
            });
        </script>
    </body>
</html>
